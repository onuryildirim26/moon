name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: the suite uses node:test, node:assert and node:vm, the
      # same promise the app makes about its own dependencies.
      - name: Run tests
        run: node --test tests/selftest.test.js tests/claims.test.js
