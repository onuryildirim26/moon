<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The mark is the period disc: a fixed circle whose vertical boundary line
       is the reading. Not a pie slice. One colour, no gradient. The same object
       appears in the top bar, in the favicon and on the installed app's tile. -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#8AA6FF" stroke-width="2"/>
  <path d="M16 2 A14 14 0 0 0 16 30 Z" fill="#8AA6FF" opacity="0.55"/>
  <line x1="16" y1="2" x2="16" y2="30" stroke="#8AA6FF" stroke-width="2"/>
</svg>
