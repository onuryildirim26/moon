<!doctype html>
<!-- English is the ground language: the markup below is what the page says
     before a single script runs, and app.js only moves off it when a stored
     preference says Turkish (it then relabels every tagged node). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon — a budget ledger</title>
<meta name="description" content="Sunucusuz bütçe defteri. Harcamalarını yaz ya da banka ekstreni yükle; veri tarayıcında kalır, istediğin an JSON olarak indirirsin. / A serverless budget ledger: your data never leaves your browser.">
<meta name="color-scheme" content="dark light">

<!-- One bar colour per surface, so the phone's address bar matches the page
     before a single script runs. All three values mirror --bg in
     css/tokens.css; change them together. While the reader is on "system" the
     first two media queries are the whole story, and the third stays off: no
     system preference asks for Prism, it is only ever picked. A pinned theme
     contradicts the system, so app.js retargets the `media` of these tags (it
     never rewrites the colours) — the dark one stays first for engines that
     ignore `media`. -->
<meta name="theme-color" data-surface="dial" media="(prefers-color-scheme: dark)" content="#10131F">
<meta name="theme-color" data-surface="paper" media="(prefers-color-scheme: light)" content="#F2F3F9">
<meta name="theme-color" data-surface="prism" media="not all" content="#120C24">

<!-- Share cards are built by crawlers that do not resolve relative paths, so
     these two carry the published address. Change them if you fork this. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://onuryildirim26.github.io/moon/">
<meta property="og:title" content="Moon — bütçe defteri">
<meta property="og:description" content="Hesap yok, sunucu yok, istek yok. Harcamaları yaz ya da CSV ekstre yükle; veri tarayıcında kalır.">
<meta property="og:image" content="https://onuryildirim26.github.io/moon/assets/onizleme.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/moon.svg" type="image/svg+xml">

<!-- Installable from the browser on both phones: the manifest carries the
     name, the surface colours and the 192/512 icons, and Safari ignores it and
     reads the apple-touch-icon instead. Neither tag asks for a network at
     runtime — they are read once, when the reader chooses to install. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

<!-- The only outbound request this app makes. Delete these three tags for a
     fully offline build: the fallback stacks in tokens.css keep the layout. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..700&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/moon.css">

<script>
/* Apply the stored theme before first paint so the page never flashes the
   wrong surface. Reads one key, tolerates every failure, sets nothing else.
   The list is the three pinnable materials; "system" is the absence of the
   attribute, which is why it is not in it. */
(function () {
  try {
    var raw = localStorage.getItem("moon.v1");
    if (!raw) return;
    var theme = JSON.parse(raw).settings.theme;
    if (theme === "dial" || theme === "paper" || theme === "prism") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  } catch (e) { /* private mode, blocked storage, bad JSON: keep defaults */ }
})();
</script>
</head>

<body>
<a class="skip" href="#view">Skip to the content</a>

<header class="top">
  <h1 class="brand">
    <svg class="brand__disc" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1"/>
      <path d="M12 1.5 A10.5 10.5 0 0 0 12 22.5 Z" fill="currentColor" opacity="0.55"/>
      <line x1="12" y1="1.5" x2="12" y2="22.5" stroke="currentColor" stroke-width="1"/>
    </svg>
    Moon
  </h1>

  <!-- app.js fills these four controls; they stay empty without JS. -->
  <div class="top__controls">
    <div class="period" id="period-control"></div>
    <div class="picker" id="currency-control"></div>
    <div class="picker" id="lang-control"></div>
    <div class="picker" id="theme-control"></div>
  </div>
</header>

<div class="shell">
  <!-- Real anchors: the back button works and the URL survives on file://.
       data-rail="primary" items stay in the phone bottom bar; "more" items
       move into the sheet that #rail-more toggles. -->
  <nav class="rail" id="rail" aria-label="Sections">
    <a class="rail__item" href="#panel"    data-i18n="nav.panel"     data-rail="primary">Panel</a>
    <a class="rail__item" href="#defter"   data-i18n="nav.ledger"    data-rail="primary">Ledger</a>
    <a class="rail__item" href="#limitler" data-i18n="nav.limits"    data-rail="primary">Limits</a>
    <a class="rail__item" href="#yatirim"  data-i18n="nav.investments" data-rail="primary">Investments</a>
    <a class="rail__item" href="#tekrar"   data-i18n="nav.recurring" data-rail="more">Recurring</a>
    <a class="rail__item" href="#hedefler" data-i18n="nav.goals"     data-rail="more">Goals</a>
    <a class="rail__item" href="#borc"     data-i18n="nav.debts"     data-rail="more">Debts</a>
    <a class="rail__item" href="#hesaplar" data-i18n="nav.accounts"  data-rail="more">Accounts</a>
    <a class="rail__item" href="#veri"     data-i18n="nav.data"      data-rail="more">Data</a>
    <button class="rail__more" id="rail-more" type="button" aria-expanded="false" aria-controls="rail" data-i18n="nav.more">More</button>
  </nav>

  <main class="view" id="view" tabindex="-1"></main>
</div>

<!-- The one control that is on every screen. Writing an expense down is the
     thing done most often, so it is never more than one tap away, and it sits
     where a thumb already is. app.js fills its label from the catalogue. -->
<button class="fab" id="fab" type="button" data-i18n-label="quick.open" aria-label="Add an expense">
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
  </svg>
</button>

<!-- The one live region in the app: undo strips and write warnings land here.
     Nothing ever pops out of a corner. -->
<div class="strip" id="strip" role="status" aria-live="polite"></div>

<noscript>
  <p class="noscript">
    Moon does its measuring in the browser, so it needs JavaScript.
    Turning it on sends nothing anywhere.
  </p>
</noscript>

<!-- Load order is the dependency order; see spec 02-sozlesme.md §1.
     Every file is an IIFE writing to one branch of window.Moon. -->
<script src="js/core.js"></script>
<script src="js/money.js"></script>
<script src="js/dates.js"></script>
<script src="js/lang.tr.js"></script>
<script src="js/lang.en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/model.js"></script>
<script src="js/csv.js"></script>
<script src="js/pdf.js"></script>
<script src="js/importer.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/sample.js"></script>
<script src="js/views.panel.js"></script>
<script src="js/views.ledger.js"></script>
<script src="js/views.limits.js"></script>
<script src="js/views.plan.js"></script>
<script src="js/views.accounts.js"></script>
<script src="js/views.investments.js"></script>
<script src="js/views.data.js"></script>
<script src="js/quickadd.js"></script>
<script src="js/app.js"></script>
</body>
</html>
